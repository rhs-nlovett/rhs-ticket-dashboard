<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team PTO - Weekly View</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
            --border-color: #e1e4e8;
            
            /* PTO Type Colors */
            --vacation: #4ea8de;
            --vacation-light: #eef7fc;
            --sick: #560bad;
            --sick-light: #f5eeff;
            --personal: #ffb703;
            --personal-light: #fffcf0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Calendar Container (Takes up full width now) */
        .calendar-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .month-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Weekly Layout Grid - Modified to 5 columns */
        .weekly-view-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 Columns for Mon-Fri */
            gap: 16px;
        }

        .day-column {
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
        }

        /* Highlight Current Day wrapper */
        .day-column.today {
            background-color: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6;
        }

        .day-header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 4px;
        }

        .today .day-header {
            border-bottom-color: #3b82f6;
        }

        .day-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .today .day-name {
            color: #3b82f6;
        }

        .day-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
            margin-top: 2px;
        }

        /* PTO Event Labels */
        .pto-event {
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            border-left: 4px solid transparent;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .pto-event .hours-stamp {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.85;
            margin-top: 4px;
        }

        .pto-vacation {
            background-color: var(--vacation-light);
            color: #0077b6;
            border-left-color: var(--vacation);
        }

        .pto-sick {
            background-color: var(--sick-light);
            color: var(--sick);
            border-left-color: var(--sick);
        }

        .pto-personal {
            background-color: var(--personal-light);
            color: #b7791f;
            border-left-color: var(--personal);
        }

        /* Helper for an empty day placeholder text */
        .no-leaves {
            font-size: 0.8rem;
            color: #cbd5e1;
            text-align: center;
            margin-top: auto;
            margin-bottom: auto;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="pto-calendar-root" class="calendar-container"></div>
    <script src="pto.script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qs@6.15.2/dist/qs.min.js"></script>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</body>
</html>
